<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 게임</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #34d399;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 24px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #0f172a;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            font-size: 18px;
            box-sizing: border-box;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(9, 36px);
            grid-template-rows: repeat(9, 36px);
            gap: 4px;
            background-color: #0f172a;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .cell {
            width: 36px;
            height: 36px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }
        .cell:hover {
            background-color: #475569;
        }
        .cell.revealed {
            background-color: #1e293b;
            border: 1px solid #334155;
        }
        #restart-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }
        #status-msg {
            margin-top: 16px;
            font-size: 14px;
            height: 20px;
            color: #94a3b8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💣 지뢰찾기</h1>
        <div class="header-bar">
            <span id="mine-count">🚩 10</span>
            <button id="restart-btn" onclick="initGame()">😊</button>
            <span id="timer">⏱️ 000</span>
        </div>
        <div id="board"></div>
        <div id="status-msg">칸을 클릭하여 게임을 시작하세요!</div>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 9;
        const MINES = 10;

        let board = [];
        let gameOver = false;
        let gameStarted = false;
        let timerInterval = null;
        let seconds = 0;
        let flagsCount = 0;
        let revealedCount = 0;

        const boardElement = document.getElementById('board');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const restartBtn = document.getElementById('restart-btn');
        const statusMsg = document.getElementById('status-msg');

        function initGame() {
            boardElement.innerHTML = '';
            board = [];
            gameOver = false;
            gameStarted = false;
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            seconds = 0;
            flagsCount = 0;
            revealedCount = 0;
            timerElement.textContent = '⏱️ 000';
            mineCountElement.textContent = `🚩 ${MINES}`;
            restartBtn.textContent = '😊';
            statusMsg.textContent = '칸을 클릭하여 게임을 시작하세요!';
            statusMsg.style.color = '#94a3b8';

            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    let cellData = { r, c, mine: false, revealed: false, flagged: false, neighborMines: 0 };
                    row.push(cellData);

                    const cellElement = document.createElement('div');
                    cellElement.className = 'cell';
                    cellElement.addEventListener('click', () => handleLeftClick(r, c));
                    cellElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    boardElement.appendChild(cellElement);
                }
                board.push(row);
            }
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!board[r][c].mine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds = Math.min(seconds + 1, 999);
                timerElement.textContent = `⏱️ ${String(seconds).padStart(3, '0')}`;
                if (seconds === 999) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        }

        function handleLeftClick(r, c) {
            if (gameOver || board[r][c].flagged || board[r][c].revealed) return;

            if (!gameStarted) {
                gameStarted = true;
                placeMines(r, c);
                startTimer();
            }

            let cell = board[r][c];
            if (cell.mine) {
                revealAllMines();
                gameOver = true;
                clearInterval(timerInterval);
                timerInterval = null;
                restartBtn.textContent = '😵';
                statusMsg.textContent = '지뢰를 밟았습니다! 게임 오버.';
                statusMsg.style.color = '#f87171';
                return;
            }

            revealCell(r, c);
            checkWinCondition();
        }

        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            revealedCount++;

            const cellElement = getCellElement(r, c);
            cellElement.classList.add('revealed');

            if (cell.neighborMines > 0) {
                cellElement.textContent = cell.neighborMines;
                const colors = ['', '#60a5fa', '#34d399', '#f87171', '#c084fc', '#facc15', '#2dd4bf', '#f472b6', '#fb923c'];
                cellElement.style.color = colors[cell.neighborMines];
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function handleRightClick(r, c) {
            if (gameOver || board[r][c].revealed) return;

            let cell = board[r][c];
            const cellElement = getCellElement(r, c);

            if (!cell.flagged) {
                if (flagsCount >= MINES) return;
                cell.flagged = true;
                flagsCount++;
                cellElement.textContent = '🚩';
            } else {
                cell.flagged = false;
                flagsCount--;
                cellElement.textContent = '';
            }

            mineCountElement.textContent = `🚩 ${MINES - flagsCount}`;
        }

        function getCellElement(r, c) {
            return boardElement.children[r * COLS + c];
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].mine) {
                        const el = getCellElement(r, c);
                        el.textContent = '💣';
                        el.style.backgroundColor = '#7f1d1d';
                    }
                }
            }
        }

        function checkWinCondition() {
            if (revealedCount === ROWS * COLS - MINES) {
                gameOver = true;
                clearInterval(timerInterval);
                timerInterval = null;
                restartBtn.textContent = '😎';
                statusMsg.textContent = `축하합니다! 승리하셨습니다! (${seconds}초)`;
                statusMsg.style.color = '#34d399';
            }
        }

        initGame();
    </script>
</body>
</html>
