<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 지뢰찾기 ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell { user-select: none; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="game-card" class="bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 flex flex-col items-center max-w-xl w-full transition-all">
        
        <!-- 타이틀 및 최고 기록 -->
        <div class="flex justify-between items-center w-full mb-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">💣</span>
                <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-amber-400">
                    MINESWEEPER PRO
                </h1>
            </div>
            <div class="text-xs font-mono bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-amber-400">
                👑 최고 기록: <span id="best-time">--초</span>
            </div>
        </div>

        <!-- 난이도 선택 버튼 -->
        <div class="flex gap-2 w-full mb-4">
            <button onclick="setDifficulty('easy')" id="btn-easy" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-rose-600 text-white transition shadow">초급 (9x9)</button>
            <button onclick="setDifficulty('medium')" id="btn-medium" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition shadow">중급 (12x12)</button>
            <button onclick="setDifficulty('hard')" id="btn-hard" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition shadow">고급 (16x16)</button>
        </div>

        <!-- 상단 정보 바 -->
        <div class="flex justify-between items-center w-full bg-slate-950 px-6 py-3 rounded-2xl mb-5 border border-slate-800 shadow-inner font-mono text-lg">
            <div class="flex items-center gap-2 text-rose-400 font-bold">
                <span>🚩</span>
                <span id="mine-count">10</span>
            </div>
            <button id="restart-btn" onclick="initGame()" class="bg-slate-800 hover:bg-slate-700 text-2xl px-3 py-0.5 rounded-xl transition active:scale-95 shadow border border-slate-700">
                😎
            </button>
            <div class="flex items-center gap-2 text-sky-400 font-bold">
                <span>⏱️</span>
                <span id="timer">000</span>
            </div>
        </div>

        <!-- 게임 보드 격자 컨테이너 -->
        <div class="overflow-auto max-w-full max-h-[60vh] p-1 flex justify-center">
            <div id="board" class="grid gap-1 bg-slate-950 p-2.5 rounded-2xl border border-slate-800 shadow-inner"></div>
        </div>

        <!-- 상태 메시지 -->
        <div id="status-msg" class="mt-4 text-sm font-medium h-6 text-slate-400 text-center">
            칸을 클릭하여 게임을 시작하세요! (첫 클릭 안전 보장 ✨)
        </div>
    </div>

    <script>
        // 난이도 설정
        let currentDiff = 'easy';
        const configs = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 12, cols: 12, mines: 20 },
            hard: { rows: 16, cols: 16, mines: 40 }
        };

        let ROWS = 9;
        let COLS = 9;
        let MINES = 10;

        let board = [];
        let gameOver = false;
        let gameStarted = false;
        let timerInterval = null;
        let seconds = 0;
        let flagsCount = 0;
        let revealedCount = 0;

        const boardElement = document.getElementById('board');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const restartBtn = document.getElementById('restart-btn');
        const statusMsg = document.getElementById('status-msg');
        const gameCard = document.getElementById('game-card');
        const bestTimeElement = document.getElementById('best-time');

        // Web Audio API 효과음 생성기
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'flag') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            ROWS = configs[diff].rows;
            COLS = configs[diff].cols;
            MINES = configs[diff].mines;

            ['easy', 'medium', 'hard'].forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                if (d === diff) {
                    btn.className = 'flex-1 py-1.5 text-xs font-bold rounded-xl bg-rose-600 text-white transition shadow';
                } else {
                    btn.className = 'flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition shadow';
                }
            });

            loadBestTime();
            initGame();
        }

        function loadBestTime() {
            const saved = localStorage.getItem(`minesweeper_best_${currentDiff}`);
            bestTimeElement.textContent = saved ? `${saved}초` : '--초';
        }

        function saveBestTime(sec) {
            const saved = localStorage.getItem(`minesweeper_best_${currentDiff}`);
            if (!saved || sec < parseInt(saved)) {
                localStorage.setItem(`minesweeper_best_${currentDiff}`, sec);
                bestTimeElement.textContent = `${sec}초 (NEW!)`;
            }
        }

        function initGame() {
            boardElement.style.gridTemplateColumns = `repeat(${COLS}, minmax(0, 1fr))`;
            boardElement.innerHTML = '';
            board = [];
            gameOver = false;
            gameStarted = false;
            clearInterval(timerInterval);
            seconds = 0;
            flagsCount = 0;
            revealedCount = 0;
            timerElement.textContent = '000';
            mineCountElement.textContent = MINES;
            restartBtn.textContent = '😎';
            statusMsg.textContent = '칸을 클릭하여 게임을 시작하세요!';
            statusMsg.className = 'mt-4 text-sm font-medium h-6 text-slate-400 text-center';
            gameCard.classList.remove('shake');

            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    let cellData = { r, c, mine: false, revealed: false, flagged: false, neighborMines: 0 };
                    row.push(cellData);

                    const cellElement = document.createElement('div');
                    // 격자 크기에 맞춰 셀 크기 유동 조절
                    const sizeClass = ROWS > 12 ? 'w-7 h-7 text-xs' : 'w-9 h-9 text-base';
                    cellElement.className = `cell ${sizeClass} bg-slate-800 hover:bg-slate-700 flex items-center justify-center font-bold cursor-pointer rounded-lg transition-all shadow-sm`;
                    
                    cellElement.addEventListener('click', () => handleLeftClick(r, c));
                    cellElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    boardElement.appendChild(cellElement);
                }
                board.push(row);
            }
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (!board[r][c].mine && Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
                if (!board[r][c].mine) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                if (seconds > 999) seconds = 999;
                timerElement.textContent = String(seconds).padStart(3, '0');
            }, 1000);
        }

        function handleLeftClick(r, c) {
            if (gameOver || board[r][c].flagged || board[r][c].revealed) return;

            if (!gameStarted) {
                gameStarted = true;
                placeMines(r, c);
                startTimer();
            }

            playSound('click');
            let cell = board[r][c];
            if (cell.mine) {
                playSound('boom');
                revealAllMines();
                gameOver = true;
                clearInterval(timerInterval);
                restartBtn.textContent = '😵';
                statusMsg.textContent = '💥 지뢰를 밟았습니다! 게임 오버.';
                statusMsg.className = 'mt-4 text-sm font-bold h-6 text-rose-400 text-center animate-pulse';
                gameCard.classList.add('shake');
                return;
            }

            revealCell(r, c);
            checkWinCondition();
        }

        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            revealedCount++;

            const cellElement = getCellElement(r, c);
            const sizeClass = ROWS > 12 ? 'w-7 h-7 text-xs' : 'w-9 h-9 text-base';
            cellElement.className = `cell ${sizeClass} bg-slate-900 flex items-center justify-center font-black rounded-lg border border-slate-800 shadow-inner`;

            if (cell.neighborMines > 0) {
                cellElement.textContent = cell.neighborMines;
                const colors = ['', 'text-sky-400', 'text-emerald-400', 'text-rose-400', 'text-purple-400', 'text-amber-400', 'text-teal-400', 'text-pink-400', 'text-orange-400'];
                cellElement.classList.add(colors[cell.neighborMines]);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) revealCell(nr, nc);
                    }
                }
            }
        }

        function handleRightClick(r, c) {
            if (gameOver || !gameStarted || board[r][c].revealed) return;

            playSound('flag');
            let cell = board[r][c];
            const cellElement = getCellElement(r, c);

            if (!cell.flagged) {
                if (flagsCount >= MINES) return;
                cell.flagged = true;
                flagsCount++;
                cellElement.textContent = '🚩';
            } else {
                cell.flagged = false;
                flagsCount--;
                cellElement.textContent = '';
            }

            mineCountElement.textContent = MINES - flagsCount;
        }

        function getCellElement(r, c) {
            return boardElement.children[r * COLS + c];
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].mine) {
                        const el = getCellElement(r, c);
                        el.textContent = '💣';
                        el.style.backgroundColor = '#4c0519';
                    }
                }
            }
        }

        function checkWinCondition() {
            if (revealedCount === ROWS * COLS - MINES) {
                playSound('win');
                gameOver = true;
                clearInterval(timerInterval);
                restartBtn.textContent = '🏆';
                statusMsg.textContent = `🎉 축하합니다! 승리하셨습니다! (${seconds}초 기록 달성)`;
                statusMsg.className = 'mt-4 text-sm font-bold h-6 text-emerald-400 text-center';
                saveBestTime(seconds);
            }
        }

        // 초기 실행
        loadBestTime();
        initGame();
    </script>
</body>
</html>
